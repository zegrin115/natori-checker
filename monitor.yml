name: Facebook Monitor

on:
  schedule:
    # */5 is GitHub's hard floor - shorter expressions are accepted by the
    # YAML parser but never fire. Offset by 2 minutes: the top of the hour is
    # the worst congestion window and sees the longest queue delays.
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # If a run overruns its slot, let it finish rather than stacking jobs that
  # would fight over the state file.
  group: fb-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Hard ceiling so a hung request can never burn an unbounded job.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
          # Poll internally for 4.5 minutes at 60s intervals, so a */5 cron
          # yields continuous 60-second coverage instead of 5-minute gaps.
          LOOP_DURATION_SECONDS: "270"
          LOOP_INTERVAL_SECONDS: "60"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor.py

      - name: Commit state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: update seen posts [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "No state change."
          fi
